[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustcurve"
version = "0.0.1"
description = "Repeated-run agent evals -> failure rates with error bars -> insurance premiums"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/trustcurve"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
